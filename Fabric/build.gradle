plugins {
    id "com.gradleup.shadow" version "9.+"
    id 'net.darkhax.curseforgegradle' version '1.+'
    id "com.modrinth.minotaur" version "2.+"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}+${minecraft_version}"

    // Mod Dependencies
    //modImplementation "com.cerbon:cerbons_api-fabric-${minecraft_version}:${cerbons_api_version}"

    // Useful Mods
    //modCompileOnlyApi "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    //modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    //modImplementation "curse.maven:jade-324717:${jade_version_fabric}"

//    modCompileOnly("com.terraformersmc:modmenu:${modmenu_version_fabric}") {
//        exclude module: "fabric-api"
//    }
//    modRuntimeOnly("com.terraformersmc:modmenu:${modmenu_version_fabric}") {
//        exclude module: "fabric-api"
//    }

    // All Projects Dependencies
//    api "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cardinal_components_version}" // Even though Cardinal Components is shipped with Cerbons API it needs to exist here too or Fabric will complain.
//    implementation "dev.onyxstudios.cardinal-components-api:cardinal-components-world:${cardinal_components_version}"

    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}")))

    common(project(path: ":common")) { transitive false }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    var replaceProperties = [
            minecraft_version_range          : minecraft_version_range_fabric,
            fabric_loader_version_range      : fabric_loader_version_range,
            mod_id                           : mod_id,
            mod_name                         : mod_name,
            mod_license                      : mod_license,
            mod_version                      : mod_version,
            mod_authors                      : mod_authors,
            mod_description                  : mod_description,
            source_code_url                  : source_code_url,
            issues_url                       : issues_url,
            curseforge_url                   : curseforge_url,
            logo_file                        : logo_file,
            cerbons_api_version_range_fabric : cerbons_api_version_range_fabric
    ]
    inputs.properties replaceProperties

    filesMatching("fabric.mod.json") {
        expand replaceProperties + [project: project]
    }
}

base {
    archivesName = archives_base_name + "-Fabric-${minecraft_version}"
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier.set("")
}

tasks.build.dependsOn shadowJar

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

