dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    //modImplementation "com.cerbon:cerbons_api-common-${minecraft_version}:${cerbons_api_version}"

    compileOnly(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}")))
}

architectury {
    common("fabric", "neoforge")
}

base {
    archivesName = archives_base_name + "-Common-${minecraft_version}"
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
}
